stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'Dinov2withNorm'
    encoder_config_path: 'facebook/dinov2-with-registers-base'
    encoder_input_size: 448
    encoder_params: {'dinov2_path': 'facebook/dinov2-with-registers-base', 'normalize': True}
    decoder_config_path: 'configs/decoder/ViTXL'
    pretrained_decoder_path: 'models/decoders/dinov2/wReg_base/ViTXL_n08_i512/model.pt'
    noise_tau: 0.
    reshape_to_2d: True
    normalization_stat_path: 'models/stats/dinov2/wReg_base/imagenet1k_512/stat.pt'

stage_2:
  target: stage2.models.lightningDiT.LightningDiT
  params:
    input_size: 32
    patch_size: 2 # 1, 2
    in_channels: 768
    hidden_size: 768
    depth: 12 # 12
    register_block_depth: 7
    num_heads: 12
    mlp_ratio: 4.0
    num_register_tokens: 0 #64
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: true
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: false
    use_register_space: false

transport:
  params:
    path_type: 'Linear'
    prediction: 'data'
    loss_weight: null
    time_dist_type: 'uniform'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [768, 32, 32] # [C, H, W]
  num_classes: 1000
  time_dist_shift_dim: 786432 # 32*32*768
  time_dist_shift_base: 4096

training:
  global_seed: 0
  epochs: 160
  global_batch_size: 1024
  grad_accum_steps: 1 # change according to your GPU memory
  ema_decays: [0.9996, 0.9998, 0.9999]
  num_workers: 4
  log_every: 100
  ckpt_every: 5000
  sample_every: 10000
  base_lr: 0.0002
  beta: [0.9, 0.95]
  wd: 0.0
  schedule_type: 'constant'
  warmup_epochs: 5
  clip_grad: 1.0
